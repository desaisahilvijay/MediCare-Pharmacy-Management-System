<svg width="200" height="80" viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d6efd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0056b3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Medical Cross Background -->
  <circle cx="40" cy="40" r="35" fill="url(#logoGradient)" opacity="0.1"/>
  
  <!-- Medical Cross -->
  <rect x="35" y="20" width="10" height="40" fill="url(#logoGradient)" rx="2"/>
  <rect x="20" y="35" width="40" height="10" fill="url(#logoGradient)" rx="2"/>
  
  <!-- Pills -->
  <ellipse cx="25" cy="25" rx="4" ry="8" fill="#28a745" transform="rotate(45 25 25)"/>
  <ellipse cx="55" cy="25" rx="4" ry="8" fill="#dc3545" transform="rotate(-45 55 25)"/>
  <ellipse cx="25" cy="55" rx="4" ry="8" fill="#ffc107" transform="rotate(-45 25 55)"/>
  <ellipse cx="55" cy="55" rx="4" ry="8" fill="#17a2b8" transform="rotate(45 55 55)"/>
  
  <!-- Company Name -->
  <text x="90" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="url(#logoGradient)">MediCare</text>
  <text x="90" y="50" font-family="Arial, sans-serif" font-size="14" fill="#666">Pharmacy</text>
  <text x="90" y="65" font-family="Arial, sans-serif" font-size="10" fill="#999">Management System</text>
</svg>